server:
  port: 19416

spring:
  application:
    name: pay-server

  config:
    import:
      - optional:nacos:yudao-springdoc.yaml
      - optional:nacos:cache-redis.yml
      - optional:nacos:yudao-ds-pay-pgsql.yaml # 加载【Nacos】的配置
      - optional:nacos:yudao-pay-application.yaml # 加载【Nacos】的配置

--- # nacos 配置
spring:
  cloud:
    nacos:
      # nacos 服务地址
      server-addr: 192.168.101.100:38848
      username: nacos
      password: nacos
      discovery:
        # 注册组
        group: DEFAULT_GROUP
        namespace: fighter-cloud
      config:
        # 配置组
        group: DEFAULT_GROUP
        namespace: fighter-cloud